    syntax: ip nat service {tcp | udp} <global-ip> <global-port> <local-ip> <local-port>
    description: DNAT端口映射(发布内部服务器)
    source: ai_knowledge
  - command: show ip nat translations
    syntax: show ip nat translations [verbose | protocol {tcp | udp} | icmp]
    description: NAT转换表
    source: ai_knowledge
  - command: show ip nat statistics
    syntax: show ip nat statistics
    description: NAT统计信息
    source: ai_knowledge
