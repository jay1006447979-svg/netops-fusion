    source: netops_toolkit
    example: 'interface GigabitEthernet 0/1

      priority-queue out'
  - command: interface <interface>
    syntax: 'interface <interface>

      srr-queue bandwidth shape <weight1> <weight2> ...'
    description: 配置队列带宽分配比例
    source: netops_toolkit
    example: 'interface GigabitEthernet 0/1

      srr-queue bandwidth shape 10 20 30 40'
  - command: policy-map <policy-name>
    syntax: 'policy-map <policy-name>

      class <class-name>

      police <bps> <burst> conform-action transmit exceed-action drop'
    description: 配置流量限速策略
    source: netops_toolkit
    example: 'policy-map LIMIT-POLICY

      class class-default

      police 10000000 10000 conform-action transmit exceed-action drop'
