cases:
- title: 接入交换机基础配置
  description: 接入层交换机初始化配置，包括VLAN、管理IP、SSH、端口安全
  steps:
  - '# 1. 系统基本配置'
  - sysname Access-SW-01
  - ''
  - '# 2. 创建VLAN'
  - vlan 10
  - ' name Sales'
  - vlan 20
  - ' name Engineering'
  - vlan 30
  - ' name Finance'
  - vlan 100
  - ' name Management'
  - ''
  - '# 3. 配置VLAN接口'
  - interface Vlan-interface 100
  - ' ip address 192.168.100.1 255.255.255.0'
  - ''
  - '# 4. 配置管理IP'
  - interface Vlan-interface 1
  - ' ip address 192.168.1.10 255.255.255.0'
  - ''
  - '# 5. 配置默认网关'
  - ip route-static 0.0.0.0 0 192.168.1.254
  - ''
  - '# 6. 配置Access端口'
  - interface GigabitEthernet 1/0/1
  - ' port link-type access'
  - ' port access vlan 10'
  - ' description Sales_PC_01'
  - ''
  - interface GigabitEthernet 1/0/2
  - ' port link-type access'
  - ' port access vlan 20'
  - ' description Engineering_PC_01'
  - ''
  - '# 7. 配置Trunk上行口'
  - interface GigabitEthernet 1/0/24
  - ' port link-type trunk'
  - ' port trunk permit vlan 10 20 30 100'
  - ' description Uplink_to_Core'
  - ''
  - '# 8. 配置SSH'
  - public-key local create rsa
  - ssh server enable
  - ''
  - local-user admin
  - ' password simple Admin@123'
  - ' authorization-attribute level 3'
  - ' service-type ssh'
  - ''
  - user-interface vty 0 4
  - ' authentication-mode scheme'
  - ' protocol inbound ssh'
  - ''
  - '# 9. 配置端口安全'
  - interface GigabitEthernet 1/0/1
  - ' port-security enable'
  - ' port-security max-mac-count 2'
  - ' port-security intrusion-mode disableport'
  - ''
  - '# 10. 配置STP边缘端口'
  - interface GigabitEthernet 1/0/1
  - ' stp edged-port'
  - ''
  - '# 11. 保存配置'
  - save
- title: 核心交换机配置
  description: 核心交换机完整配置，包括VLANIF、路由、ACL、VRRP
  steps:
  - '# 1. 系统配置'
  - sysname Core-SW-01
  - ''
  - '# 2. 创建VLAN'
  - vlan 10 20 30 100 200
  - ''
  - '# 3. 配置VLAN接口'
  - interface Vlan-interface 10
  - ' ip address 192.168.10.1 255.255.255.0'
  - ' description Gateway_VLAN10_Sales'
  - ''
  - interface Vlan-interface 20
  - ' ip address 192.168.20.1 255.255.255.0'
  - ' description Gateway_VLAN20_Engineering'
  - ''
  - interface Vlan-interface 30
  - ' ip address 192.168.30.1 255.255.255.0'
  - ' description Gateway_VLAN30_Finance'
  - ''
  - interface Vlan-interface 100
  - ' ip address 192.168.100.1 255.255.255.0'
  - ' description Management_Network'
  - ''
  - interface Vlan-interface 200
  - ' ip address 10.0.0.1 255.255.255.252'
  - ' description WAN_Uplink'
  - ''
  - '# 4. 配置DHCP'
  - dhcp enable
  - dhcp server ip-pool vlan10_pool
  - ' network 192.168.10.0 mask 255.255.255.0'
  - ' gateway-list 192.168.10.1'
  - ' dns-list 8.8.8.8 114.114.114.114'
  - ''
  - interface Vlan-interface 10
  - ' dhcp select server'
  - ''
  - '# 5. 配置静态路由'
  - ip route-static 0.0.0.0 0 10.0.0.2
  - ''
  - '# 6. 配置OSPF'
  - ospf 1 router-id 1.1.1.1
  - ' area 0.0.0.0'
  - '  network 192.168.0.0 0.0.255.255'
  - '  network 10.0.0.0 0.0.0.3'
  - ''
  - '# 7. 配置ACL'
  - acl number 3000
  - ' rule 0 deny ip source 192.168.20.0 0.0.0.255 destination 192.168.30.0 0.0.0.255'
  - ' rule 5 permit ip'
  - ''
  - interface Vlan-interface 20
  - ' packet-filter 3000 outbound'
  - ''
  - '# 8. 配置VRRP'
  - interface Vlan-interface 10
  - ' vrrp vrid 1 virtual-ip 192.168.10.254'
  - ' vrrp vrid 1 priority 120'
  - ' vrrp vrid 1 preempt-mode timer delay 20'
  - ''
  - '# 9. 配置NTP'
  - ntp-service enable
  - ntp-service unicast-server 192.168.100.100
  - clock timezone BJ add 08:00
  - ''
  - '# 10. 配置日志'
  - info-center enable
  - info-center loghost 192.168.100.101
  - ''
  - '# 11. 配置SNMP'
  - snmp-agent
  - snmp-agent sys-info version v2c
  - snmp-agent community read Public@123
  - snmp-agent sys-info contact admin@company.com
  - ''
  - save
- title: 链路聚合配置
  description: H3C链路聚合配置，LACP动态模式
  steps:
  - '# 1. 创建聚合接口'
  - interface Bridge-Aggregation 1
  - ' description To_Core_Switch'
  - ' port link-type trunk'
  - ' port trunk permit vlan 10 20 30'
  - ' link-aggregation mode dynamic'
  - ''
  - '# 2. 添加成员接口'
  - interface GigabitEthernet 1/0/1
  - ' port link-aggregation group 1'
  - ''
  - interface GigabitEthernet 1/0/2
  - ' port link-aggregation group 1'
  - ''
  - interface GigabitEthernet 1/0/3
  - ' port link-aggregation group 1'
  - ''
  - '# 3. 配置LACP优先级(可选)'
  - lacp system-priority 100
  - ''
  - '# 4. 验证配置'
  - display link-aggregation summary
  - display link-aggregation verbose
- title: MSTP多生成树配置
  description: MSTP多实例生成树配置，实现负载均衡
  steps:
  - '# 1. 配置MSTP域'
  - stp region-configuration
  - ' region-name COMPANY_MST'
  - ' revision-level 1'
  - ' instance 1 vlan 10 20'
  - ' instance 2 vlan 30 40'
  - ' active region-configuration'
  - ''
  - '# 2. 配置STP模式'
  - stp mode mstp
  - ''
  - '# 3. 核心交换机1配置'
  - stp instance 1 root primary
  - stp instance 2 root secondary
  - ''
  - '# 4. 核心交换机2配置'
  - stp instance 1 root secondary
  - stp instance 2 root primary
  - ''
  - '# 5. 启用BPDU保护'
  - stp bpdu-protection
  - ''
  - '# 6. 配置边缘端口'
  - interface GigabitEthernet 1/0/1
  - ' stp edged-port'
  - ''
  - '# 7. 验证配置'
  - display stp region-configuration
  - display stp instance 1
  - display stp instance 2
- title: IRF堆叠配置
  description: H3C IRF智能弹性架构配置
  steps:
  - '# 交换机1配置'
  - '# 1. 设置IRF成员编号和优先级'
  - irf member 1 priority 32
  - ''
  - '# 2. 配置IRF端口'
  - irf-port 1/1
  - ' port group interface GigabitEthernet 1/0/47'
  - ' port group interface GigabitEthernet 1/0/48'
  - ''
  - '# 3. 激活IRF配置'
  - irf-port-configuration active
  - ''
  - '# 交换机2配置(先不连接IRF线)'
  - '# 1. 修改成员编号'
  - irf member 1 renumber 2
  - ''
  - '# 2. 重启后配置'
  - irf member 2 priority 30
  - ''
  - irf-port 2/1
  - ' port group interface GigabitEthernet 2/0/47'
  - ' port group interface GigabitEthernet 2/0/48'
  - ''
  - irf-port-configuration active
  - ''
  - '# 4. MAD配置(多Active检测)'
  - mad enable
  - mad bfd enable
  - ''
  - '# 5. 验证配置'
  - display irf
  - display irf topology
  - display irf configuration
- title: DHCP服务器配置
  description: 交换机作为DHCP服务器配置
  steps:
  - '# 1. 启用DHCP服务'
  - dhcp enable
  - ''
  - '# 2. 配置地址池'
  - dhcp server ip-pool vlan10_pool
  - ' network 192.168.10.0 mask 255.255.255.0'
  - ' gateway-list 192.168.10.1'
  - ' dns-list 8.8.8.8 114.114.114.114'
  - ' excluded-ip-address 192.168.10.1 192.168.10.10'
  - ' expired day 3'
  - ''
  - dhcp server ip-pool vlan20_pool
  - ' network 192.168.20.0 mask 255.255.255.0'
  - ' gateway-list 192.168.20.1'
  - ' dns-list 8.8.8.8'
  - ' expired day 7'
  - ''
  - '# 3. 在VLAN接口启用DHCP'
  - interface Vlan-interface 10
  - ' dhcp select server'
  - ''
  - interface Vlan-interface 20
  - ' dhcp select server'
  - ''
  - '# 4. 配置DHCP中继(如需要)'
  - interface Vlan-interface 30
  - ' dhcp select relay'
  - ' dhcp relay server-address 192.168.100.100'
  - ''
  - '# 5. 查看DHCP配置'
  - display dhcp server ip-in-use
  - display dhcp server statistics
- title: QoS流量限速配置
  description: 基于ACL的流量限速配置
  steps:
  - '# 1. 创建ACL匹配流量'
  - acl number 3000
  - ' rule 0 permit ip source 192.168.10.0 0.0.0.255'
  - ''
  - '# 2. 创建流分类'
  - traffic classifier CLASS_LIMIT
  - ' if-match acl 3000'
  - ''
  - '# 3. 创建流行为'
  - traffic behavior BEHAV_LIMIT
  - ' car cir 10000 pir 20000 green pass yellow pass red discard'
  - ''
  - '# 4. 创建流策略'
  - traffic policy POLICY_LIMIT
  - ' classifier CLASS_LIMIT behavior BEHAV_LIMIT'
  - ''
  - '# 5. 应用流策略'
  - interface GigabitEthernet 1/0/1
  - ' qos apply policy POLICY_LIMIT inbound'
  - ''
  - '# 6. 验证配置'
  - display traffic policy
- title: 端口镜像配置
  description: 配置端口镜像用于流量监控
  steps:
  - '# 1. 创建镜像组'
  - mirroring-group 1 local
  - ''
  - '# 2. 配置观察端口'
  - mirroring-group 1 monitor-port GigabitEthernet 1/0/24
  - ''
  - '# 3. 配置镜像端口(镜像所有流量)'
  - mirroring-group 1 mirroring-port GigabitEthernet 1/0/1 both
  - ''
  - '# 4. 配置镜像端口(只镜像入方向)'
  - mirroring-group 1 mirroring-port GigabitEthernet 1/0/2 inbound
  - ''
  - '# 5. 验证配置'
  - display mirroring-group all
- title: BFD与Track联动VRRP
  description: BFD检测链路故障联动VRRP快速切换
  steps:
  - '# 1. 启用BFD'
  - bfd
  - ''
  - '# 2. 创建BFD会话'
  - bfd vrrp_bfd bind peer-interface GigabitEthernet 1/0/1 source-ip 192.168.1.1 destination-ip 192.168.1.2
  - ' discriminator local 1'
  - ' discriminator remote 2'
  - ' min-transmit-interval 100'
  - ' min-receive-interval 100'
  - ''
  - '# 3. 创建Track项'
  - track 1 bfd singlehop session vrrp_bfd
  - ''
  - '# 4. VRRP联动Track'
  - interface Vlan-interface 10
  - ' vrrp vrid 1 virtual-ip 192.168.10.254'
  - ' vrrp vrid 1 priority 120'
  - ' vrrp vrid 1 track 1 reduced 40'
  - ''
  - '# 5. 验证配置'
  - display bfd session
  - display track
  - display vrrp
