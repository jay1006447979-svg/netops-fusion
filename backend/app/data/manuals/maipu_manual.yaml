- name: 接口VLAN
  commands:
  - command: interface <if>
    syntax: 'interface <if>

      switchport mode access

      switchport access vlan <id>'
    description: 配置接口为Access模式并加入VLAN
    source: netops_toolkit
    example: 'interface gigabitethernet 0/1

      switchport mode access

      switchport access vlan 10'
  - command: interface <if>
    syntax: 'interface <if>

      switchport mode trunk

      switchport trunk allowed vlan <list>'
    description: 配置接口为Trunk模式
    source: netops_toolkit
    example: 'interface gigabitethernet 0/24

      switchport mode trunk

      switchport trunk allowed vlan 10,20,30'
  - command: switchport trunk allowed vlan all
    syntax: switchport trunk allowed vlan all
    description: Trunk允许所有VLAN通过
    source: netops_toolkit
