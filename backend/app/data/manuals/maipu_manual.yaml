      instance 1 vlan 10,20'
  - command: spanning-tree mst configuration
    syntax: 'spanning-tree mst configuration

      revision <level>'
    description: 设置MST修订级别
    source: netops_toolkit
    example: 'spanning-tree mst configuration

      revision 1'
  - command: spanning-tree mst <id> priority <priority>
    syntax: spanning-tree mst <id> priority <priority>
    description: 设置实例网桥优先级
    source: netops_toolkit
    example: spanning-tree mst 1 priority 4096
  - command: show spanning-tree mst configuration
    syntax: show spanning-tree mst configuration
    description: 查看MST配置
    source: netops_toolkit
    example: show spanning-tree mst configuration
- name: VRRP配置
  commands:
  - command: interface <if>
    syntax: 'interface <if>

      standby <group-id> ip <vip>'
    description: 配置VRRP/HSRP虚拟网关
    source: netops_toolkit
    example: 'interface vlan 10

      standby 1 ip 192.168.10.254'
  - command: standby <group-id> priority <priority>
    syntax: standby <group-id> priority <priority>
    description: 设置优先级
    source: netops_toolkit
