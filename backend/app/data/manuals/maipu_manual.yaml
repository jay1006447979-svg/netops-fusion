    source: netops_toolkit
    example: username admin secret Admin@123
  - command: enable secret <password>
    syntax: enable secret <password>
    description: 设置进入特权模式的密码
    source: netops_toolkit
    example: enable secret Enable@123
  - command: enable password <password>
    syntax: enable password <password>
    description: 设置明文特权密码(不推荐)
    source: netops_toolkit
    example: enable password Enable@123
  - command: service password-encryption
    syntax: service password-encryption
    description: 启用密码加密服务
