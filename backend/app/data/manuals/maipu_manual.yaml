- name: SSH配置
  commands:
  - command: ip ssh server enable
    syntax: ip ssh server enable
    description: 启用SSH服务器
    source: netops_toolkit
    example: ip ssh server enable
  - command: ip ssh version <1|2>
    syntax: ip ssh version <1|2>
    description: 设置SSH协议版本(推荐v2)
    source: netops_toolkit
    example: ip ssh version 2
  - command: crypto key generate rsa modulus <bits>
    syntax: crypto key generate rsa modulus <bits>
    description: 生成RSA密钥对(推荐2048位)
    source: netops_toolkit
    example: crypto key generate rsa modulus 2048
  - command: crypto key generate ecdsa
    syntax: crypto key generate ecdsa
    description: 生成ECDSA密钥对
    source: netops_toolkit
    example: crypto key generate ecdsa
  - command: ip ssh timeout <seconds>
    syntax: ip ssh timeout <seconds>
    description: 设置SSH连接超时时间
    source: netops_toolkit
    example: ip ssh timeout 60
  - command: ip ssh authentication-retries <times>
    syntax: ip ssh authentication-retries <times>
    description: 设置SSH认证重试次数
    source: netops_toolkit
    example: ip ssh authentication-retries 3
  - command: line vty 0 4
    syntax: 'line vty 0 4

      transport input ssh

      login local'
    description: 配置VTY只允许SSH登录使用本地认证
    source: netops_toolkit
    example: 'line vty 0 4

      transport input ssh

      login local'
  - command: show ip ssh
    syntax: show ip ssh
    description: 查看SSH服务状态
    source: netops_toolkit
    example: show ip ssh
  - command: show ssh
    syntax: show ssh
    description: 查看当前SSH会话
    source: netops_toolkit
    example: show ssh
  - command: crypto key zeroize rsa
    syntax: crypto key zeroize rsa
    description: 删除RSA密钥对
    source: netops_toolkit
    example: crypto key zeroize rsa
- name: Telnet配置
  commands:
  - command: ip telnet server enable
    syntax: ip telnet server enable
